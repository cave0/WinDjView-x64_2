name: build-x64

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

# Auto-cancel superseded runs to save Windows runner quota
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC x64 Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build WinDjView
        shell: cmd
        run: build_x64.bat

      - name: Upload Binary and Symbols
        uses: actions/upload-artifact@v4
        with:
          name: WinDjView-x64
          path: |
            Release_x64/WinDjView.exe
            Release_x64/WinDjView.pdb
          if-no-files-found: error
          retention-days: 14
